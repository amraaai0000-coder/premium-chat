<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Premium AI chat interface">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Premium Chat">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Premium Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #070707; margin: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #070707; color: #9A6CFF;
      font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
      letter-spacing: 3px; transition: opacity .4s ease; }
    #loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">PREMIUM CHAT</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('hide'); setTimeout(function(){ el.remove(); }, 500); }
    });
  </script>
</body>
</html>
